[project]
name = "rag-mlops-techqa"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "datasets",
    "huggingface-hub",
    "pandas",
    "pyarrow",
    "pyyaml",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
